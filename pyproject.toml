[project]
name = "thesis-rag"
version = "0.1.0"
description = "Retrieval-augmented Q&A over the 19 papers behind my skripsi."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pymupdf",
    "pdfplumber",
    "rapidfuzz",
    "tiktoken",
    "fastembed",
    "sqlite-vec",
    "anthropic",
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "slowapi",
    "pydantic-settings",
    "pyyaml",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag", "app"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Ruff formats Python blocks inside .md files; keep it off the plan docs.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
